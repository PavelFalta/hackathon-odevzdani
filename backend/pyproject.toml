[project]
name = "posledni-backend"
version = "0.1.0"
description = "API for map assistant and RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.10.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "bcrypt>=4.2.0",
    "faiss-cpu>=1.9.0",
    "numpy>=2.0.0",
    "openai>=1.55.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "PLR", "RUF", "PTH", "T20",
]
ignore = ["B008"]  # Depends() in FastAPI defaults

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/test_datazapad_normalize.py" = ["PLR2004"]
"app/knowledge/store.py" = ["PLR0913"]
"tests/test_knowledge.py" = ["PLR2004"]
"tests/test_assistant.py" = ["PLR2004"]
"tests/test_realtime.py" = ["PLR2004"]
"tests/test_google_places_reviews.py" = ["PLR2004"]
"app/services/embed_frame_policy.py" = ["PLR0911", "PLR2004"]
"app/api/browser.py" = ["PLR2004"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
