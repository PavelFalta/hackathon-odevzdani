services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: kairos
      POSTGRES_DB: kairos
    volumes:
      - kairos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairos"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://kairos:kairos@db:5432/kairos
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      REVIEWS_API_KEY: ${REVIEWS_API_KEY:-}
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
      KNOWLEDGE_DIR: /app/datazapad/knowledge
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      KNOWLEDGE_EMBEDDER: ${KNOWLEDGE_EMBEDDER:-openai}
      # Prefer MAPBOX_ACCESS_TOKEN; else same token as the frontend map (from root .env).
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-${VITE_MAPBOX_TOKEN}}
      VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    volumes:
      - ./datazapad/knowledge:/app/datazapad/knowledge
    expose:
      - "8000"
    # Host 8001 avoids clashing with local `uvicorn --port 8000` during dev.
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kairos_pg:
